<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f1a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e089" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#d4af37" flood-opacity="0.4" />
    </filter>
  </defs>
  {/* Outer shield crest */}
  <path
    d="M19 2C27 2 34 5 34 5C34 17 31 27 19 36C7 27 4 17 4 5C4 5 11 2 19 2Z"
    fill="url(#shield-grad)"
    stroke="url(#gold-grad)"
    stroke-width="2"
    stroke-linejoin="round"
    filter="url(#gold-glow)"
  />
  {/* Inner crest accent line */}
  <path
    d="M19 4.5C25.5 4.5 31.5 7 31.5 7C31.5 16 28.5 24.5 19 33C9.5 24.5 6.5 16 6.5 7C6.5 7 12.5 4.5 19 4.5Z"
    stroke="url(#gold-grad)"
    stroke-width="0.75"
    stroke-opacity="0.55"
    fill="none"
  />
  {/* Football */}
  <g style="transform-origin: 19px 18.5px">
    <circle cx="19" cy="18.5" r="7.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
    <polygon points="19,14.5 22.2,16.8 21,20.5 17,20.5 15.8,16.8" fill="#0f172a" />
    <path
      d="M19 14.5V11M22.2 16.8L25.5 15M21 20.5L23.5 23.5M17 20.5L14.5 23.5M15.8 16.8L12.5 15"
      stroke="#0f172a"
      stroke-width="1.1"
      stroke-linecap="round"
    />
  </g>
</svg>

